syntax = "proto3";

package simple_rpg;

// ─── Low-Frequency Messages (JSON replacement) ───

// Server → Client: Session initialization
message InitMessage {
  uint32 player_id = 1;
  map<uint32, EntityInit> entities = 2;
  map<uint32, string> tile_registry = 3;
}

message EntityInit {
  float x = 1;
  float y = 2;
  string type = 3;
  uint32 focused_id = 4;
}

// Server → Client: Inventory contents (on-demand)
message InventoryContents {
  repeated ItemSlot items = 1;
  float current_volume = 2;
  float max_volume = 3;
  float current_weight = 4;
}

message ItemSlot {
  string name = 1;
  string sprite_key = 2;
  float volume = 3;
  float weight = 4;
  bool stackable = 5;
  int32 quantity = 6;
  int32 max_stack = 7;
}

// Server → Client: Interaction response (loot UI, dialog)
message InteractionResponse {
  uint32 target_id = 1;
  string interaction_type = 2;
  InventoryContents player_inventory = 3;
  InventoryContents target_inventory = 4;
}

// Note: The 60Hz binary snapshot protocol (protocol.hpp / SnapshotBuffer)
// is NOT replaced by protobuf — it remains hand-tuned for zero-copy performance.
